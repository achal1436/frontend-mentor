<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>interactive-rating-component-main</title>
</head>
<style>
  body {
    background-color: hsl(216, 12%, 8%);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    background-color: hsl(213, 19%, 18%);
    width: 500px;
    height: 470px;
    border-radius: 10px;
    margin-top: 150px;
  }

  .image {
    height: 50px;
    width: 50px;
    border-radius: 50%;
    background-color: hsl(212, 11%, 28%);

    margin: 30px;
  }

  .image img {
    margin: 15px;
  }

  h1 {
    margin: 30px;
    color: white;
  }

  p {
    color: white;
    font-size: 22px;
    margin: 30px;
  }

  .btn {
    margin-left: 15px;
  }

  .btn button {
    height: 60px;
    width: 60px;
    border-radius: 50%;
    background-color: hsl(212, 11%, 28%);
    margin: 15px;
    border: none;
    color: white;
  }

  .btn button:hover {
    background-color: hsl(25, 97%, 53%);
    cursor: pointer;

  }

  #submit {
    width: 420px;
    height: 50px;
    text-align: center;
    border-radius: 30px;
    margin-left: 35px;
    margin-top: 25px;
    background-color: hsl(25, 97%, 53%);
    border: none;
  }

  #submit:hover {
    cursor: pointer;
    background-color: white;

  }

  .box {
    background-color: hsl(213, 19%, 18%);
    width: 440px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 30px;
    margin-top: 150px;
  }

  .image2 {
    margin-bottom: 20px;
  }

  .box h3 {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    height: 30px;
    width: 300px;
    margin-left: 60px;
    border-radius: 20px;
    background-color: hsl(212, 11%, 28%);
    color: rgb(247, 135, 90);

  }

  .box h1 {
    margin-bottom: 10px;

  }

  .box p {
    line-height: 1.6;
    margin: 0;
  }

  .box {
    display: none;
  }
</style>

<body>
  <div class="container">
    <div class="image">
      <img src="images/icon-star.svg" alt="">
    </div>

    <h1>How did we do?</h1>
    <p>Please let us know how we did with your support request. All feedback is appreciated to help us improve our
      offring</p>
    <div class="btn">
      <button id="rating">1</button>
      <button id="rating">2</button>
      <button id="rating">3</button>
      <button id="rating">4</button>
      <button id="rating">5</button>
    </div>
    <button id="submit">SUBMIT</button>
  </div>
  <div class="box">
    <img class="image2" src="images/illustration-thank-you.svg" alt="">
    <h3>You selected 4 out of 5</h3>
    <h1>Thank You!</h1>
    <p>We apriciate you taking the time to give a rating. if you ever need more support don`t hesitate to get in touch!
    </p>

  </div>
  <script src="project.js"></script>
</body>

</html>
